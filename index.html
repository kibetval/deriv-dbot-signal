<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deriv DBot Signal Generator</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0f1b2d;
      --panel-alt: #13253d;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #34d399;
      --blue: #60a5fa;
      --red: #f87171;
      --amber: #fbbf24;
      --purple: #a78bfa;
      --shadow: rgba(15, 23, 42, 0.8);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #12263d, var(--bg) 40%);
      color: var(--text);
    }

    body {
      padding: 24px 18px 40px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .app-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-header h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card {
      background: rgba(15, 27, 45, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 18px 40px var(--shadow);
      margin-bottom: 18px;
    }

    .card-title {
      margin: 0 0 14px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    select:focus, input:focus {
      border-color: rgba(96, 165, 250, 0.9);
      transform: translateY(-1px);
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #startBtn {
      background: linear-gradient(135deg, var(--green), #0ea5e9);
      color: #04131b;
    }

    #stopBtn {
      background: linear-gradient(135deg, #ef4444, #fb7185);
      color: white;
    }

    .signal-box {
      background: linear-gradient(180deg, rgba(18, 38, 61, 0.95), rgba(9, 17, 29, 0.95));
      border: 1px solid rgba(52, 211, 153, 0.6);
      border-radius: 16px;
      padding: 18px 16px 16px;
      text-align: center;
    }

    .signal-label {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .signal-digit {
      font-size: clamp(2.8rem, 7vw, 4.1rem);
      font-weight: 900;
      color: var(--green);
      line-height: 1;
      margin: 6px 0 12px;
    }

    .signal-type {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(96, 165, 250, 0.14);
      border: 1px solid rgba(96, 165, 250, 0.25);
      color: var(--blue);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      background: rgba(10, 18, 30, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
    }

    .metric .label {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      margin-bottom: 6px;
    }

    .metric strong {
      font-size: 1rem;
      font-weight: 800;
    }

    .tick-stream {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 6px 4px;
      min-height: 56px;
      align-items: center;
    }

    .tick-pill {
      min-width: 42px;
      min-height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
      border: 1px solid var(--border);
      color: var(--blue);
      font-weight: 800;
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .stream-empty {
      color: var(--muted);
      font-size: 0.85rem;
      width: 100%;
      text-align: center;
      padding: 12px 0;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 12px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.7);
    }

    .dot.connected {
      background: var(--green);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
    }

    @media (max-width: 560px) {
      .control-grid,
      .metrics-grid {
        grid-template-columns: 1fr;
      }

      body {
        padding-inline: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>Deriv DBot Signal Generator</h1>
      <p>Real-time digit contract insights based on live tick behavior</p>
    </header>

    <section class="card">
      <div class="control-grid">
        <div>
          <label for="marketSelect">Market</label>
          <select id="marketSelect">
            <option value="R_10">Volatility 10</option>
            <option value="R_25">Volatility 25</option>
            <option value="R_50" selected>Volatility 50</option>
            <option value="R_100">Volatility 100</option>
          </select>
        </div>

        <div>
          <label for="tickCountInput">Sample Ticks</label>
          <input id="tickCountInput" type="number" min="10" max="200" value="50" />
        </div>
      </div>

      <div class="button-row">
        <button id="startBtn" onclick="startBot()">Start Stream</button>
        <button id="stopBtn" onclick="stopBot()" disabled>Stop</button>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">
        <span>DBot Signal</span>
        <span id="marketTag" style="color: var(--green); font-size: 0.8rem;">R_50</span>
      </h3>

      <div class="signal-box">
        <div class="signal-label">Prediction Value</div>
        <div id="dbotPredictionDigit" class="signal-digit">-</div>
        <div id="dbotContractType" class="signal-type">WAITING...</div>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">Probability Analysis</h3>
      <div class="metrics-grid">
        <div class="metric">
          <span class="label">Coldest Digit</span>
          <strong id="statCold" style="color: var(--red);">-</strong>
        </div>
        <div class="metric">
          <span class="label">Hottest Digit</span>
          <strong id="statHot" style="color: var(--blue);">-</strong>
        </div>
        <div class="metric">
          <span class="label">Even / Odd</span>
          <strong id="statEvenOdd">-</strong>
        </div>
        <div class="metric">
          <span class="label">Over / Under</span>
          <strong id="statOverUnder">-</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">Live Tick Stream</h3>
      <div id="tickStream" class="tick-stream">
        <div class="stream-empty">Stream inactive. Click Start Stream.</div>
      </div>

      <div class="status-row">
        <div class="status-left">
          <span id="connectionDot" class="dot"></span>
          <span id="connectionStatus">Disconnected</span>
        </div>
        <strong id="activeSymbolLabel">R_50</strong>
      </div>
    </section>
  </div>

  <script>
    const state = {
      ws: null,
      isRunning: false,
      tickHistory: [],
      subscriptionId: null,
      symbol: 'R_50',
      maxTicks: 50
    };

    function setStatus(statusText, connected) {
      document.getElementById('connectionStatus').innerText = statusText;
      const dot = document.getElementById('connectionDot');
      if (connected) {
        dot.classList.add('connected');
      } else {
        dot.classList.remove('connected');
      }
    }

    function startBot() {
      state.symbol = document.getElementById('marketSelect').value;
      state.maxTicks = parseInt(document.getElementById('tickCountInput').value) || 50;

      state.tickHistory = [];
      state.isRunning = true;
      document.getElementById('marketTag').innerText = state.symbol;
      document.getElementById('activeSymbolLabel').innerText = state.symbol;

      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('marketSelect').disabled = true;
      document.getElementById('tickCountInput').disabled = true;

      if (state.ws) {
        try { state.ws.close(); } catch (e) {}
      }

      state.ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

      state.ws.onopen = () => {
        setStatus('Connected (Live Stream)', true);

        state.ws.send(JSON.stringify({
          ticks_history: state.symbol,
          count: state.maxTicks,
          end: 'latest',
          style: 'ticks',
          req_id: 1
        }));

        state.ws.send(JSON.stringify({
          ticks: state.symbol,
          subscribe: 1,
          req_id: 2
        }));
      };

      state.ws.onmessage = (event) => {
        if (!state.isRunning) return;
        let data;

        try {
          data = JSON.parse(event.data);
        } catch (error) {
          return;
        }

        if (data.msg_type === 'history' && data.history && Array.isArray(data.history.prices)) {
          const pipSize = data.pip_size || 2;
          data.history.prices.forEach((price) => processTick(price, pipSize));
          updateDashboard();
        }

        if (data.msg_type === 'tick' && data.tick) {
          if (data.subscription && data.subscription.id) {
            state.subscriptionId = data.subscription.id;
          }
          processTick(data.tick.quote, data.tick.pip_size || 2);
          updateDashboard();
        }
      };

      state.ws.onerror = () => {
        setStatus('Connection Error', false);
      };

      state.ws.onclose = () => {
        if (!state.isRunning) {
          setStatus('Stopped', false);
        } else {
          setStatus('Disconnected', false);
        }
      };
    }

    function stopBot() {
      state.isRunning = false;

      if (state.ws) {
        if (state.subscriptionId) {
          try {
            state.ws.send(JSON.stringify({ forget: state.subscriptionId }));
          } catch (e) {}
        }
        try { state.ws.close(); } catch (e) {}
      }

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('marketSelect').disabled = false;
      document.getElementById('tickCountInput').disabled = false;
      setStatus('Stopped', false);
    }

    function processTick(price, pipSize) {
      if (price === undefined || price === null) return;

      const priceStr = Number(price).toFixed(pipSize);
      const lastDigit = parseInt(priceStr.slice(-1), 10);
      if (Number.isNaN(lastDigit)) return;

      state.tickHistory.push(lastDigit);
      if (state.tickHistory.length > state.maxTicks) {
        state.tickHistory.shift();
      }

      renderStream();
    }

    function renderStream() {
      const container = document.getElementById('tickStream');
      container.innerHTML = '';

      if (!state.tickHistory.length) {
        container.innerHTML = '<div class="stream-empty">Stream inactive. Click Start Stream.</div>';
        return;
      }

      state.tickHistory.slice(-15).reverse().forEach((digit) => {
        const pill = document.createElement('div');
        pill.className = 'tick-pill';
        pill.innerText = digit;
        container.appendChild(pill);
      });
    }

    function updateDashboard() {
      if (!state.tickHistory.length) return;

      const counts = Array(10).fill(0);
      let evenCount = 0;
      let overCount = 0;

      state.tickHistory.forEach((digit) => {
        counts[digit]++;
        if (digit % 2 === 0) evenCount++;
        if (digit > 4) overCount++;
      });

      const total = state.tickHistory.length;
      let coldDigit = 0;
      let hotDigit = 0;
      let minCount = Infinity;
      let maxCount = -1;

      counts.forEach((count, digit) => {
        if (count < minCount) {
          minCount = count;
          coldDigit = digit;
        }
        if (count > maxCount) {
          maxCount = count;
          hotDigit = digit;
        }
      });

      const coldPct = ((minCount / total) * 100).toFixed(1);
      const hotPct = ((maxCount / total) * 100).toFixed(1);
      const evenPct = ((evenCount / total) * 100).toFixed(0);
      const oddPct = (100 - Number(evenPct)).toFixed(0);

      const overThreshold = total * 0.55;
      const underThreshold = total * 0.45;
      let overUnderText = 'Balanced';
      if (overCount > overThreshold) overUnderText = 'Over Bias (>4)';
      else if (overCount < underThreshold) overUnderText = 'Under Bias (<5)';

      document.getElementById('statCold').innerText = `Digit ${coldDigit} (${coldPct}%)`;
      document.getElementById('statHot').innerText = `Digit ${hotDigit} (${hotPct}%)`;
      document.getElementById('statEvenOdd').innerText = `Even: ${evenPct}% | Odd: ${oddPct}%`;
      document.getElementById('statOverUnder').innerText = overUnderText;

      const predictionDigit = coldDigit;
      const signalType = overCount > total * 0.5 ? 'DIGITDIFF' : 'DIGITMATCH';

      document.getElementById('dbotPredictionDigit').innerText = predictionDigit;
      document.getElementById('dbotContractType').innerText = `${signalType} (${signalType === 'DIGITDIFF' ? 'Differ' : 'Match'} ${predictionDigit})`;
    }
  </script>
</body>
</html>
